name: Weekly SEO Report

on:
  schedule:
    - cron: '0 8 * * 0'
  workflow_dispatch:

jobs:
  seo-report:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install google-auth google-auth-oauthlib google-api-python-client requests

      - name: Run GSC Analyzer
        env:
          GSC_TOKEN_JSON: ${{ secrets.GSC_TOKEN_JSON }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
        run: python scripts/gsc_analyzer.py

      - name: Commit report
        run: |
          git config user.name "SEO Bot"
          git config user.email "bot@cryptolockua.com"
          git add reports/ || true
          git diff --staged --quiet || git commit -m "📊 SEO report ${{ env.date }}"
          git push || true
